- name: Create VPS operator directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ vps_backup_dir }}"
      mode: "0700"
    - path: "{{ vps_monitor_state_dir }}"
      mode: "0700"
    - path: "{{ vps_ops_env_dir }}"
      mode: "0700"

- name: Install initial VPS operator notification env file if missing
  template:
    src: env.j2
    dest: "{{ vps_ops_env_file }}"
    owner: root
    group: root
    mode: "0600"
    force: false

- name: Validate VPS backup off-box settings
  assert:
    that:
      - vps_backup_offbox_target | length > 0
      - vps_backup_offbox_target is search(':')
      - vps_backup_offbox_state_file is match('^/')
      - vps_backup_offbox_pending_file is match('^/')
      - vps_backup_offbox_max_age_hours | int > 0
    fail_msg: >
      Set vps_backup_offbox_target to an rsync-over-SSH target such as
      user@host:/path and set absolute off-box state/pending file paths before
      enabling off-box backups.
  when: vps_backup_offbox_enabled | bool

- name: Install VPS backup off-box packages
  apt:
    name:
      - openssh-client
      - rsync
    state: present
  when: vps_backup_offbox_enabled | bool

- name: Install VPS operator scripts
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: agent-vps.j2
      dest: /usr/local/bin/agent-vps
      mode: "0755"
    - src: agent-vps-status.j2
      dest: /usr/local/sbin/agent-vps-status
      mode: "0755"
    - src: agent-vps-backup.j2
      dest: /usr/local/sbin/agent-vps-backup
      mode: "0755"
    - src: agent-vps-backup-offbox.j2
      dest: /usr/local/sbin/agent-vps-backup-offbox
      mode: "0755"
    - src: agent-vps-healthcheck.j2
      dest: /usr/local/sbin/agent-vps-healthcheck
      mode: "0755"
    - src: agent-vps-docker-cleanup.j2
      dest: /usr/local/sbin/agent-vps-docker-cleanup
      mode: "0755"

- name: Install VPS operator systemd service/timer units
  template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - agent-vps-backup.service.j2
    - agent-vps-backup.timer.j2
    - agent-vps-docker-cleanup.service.j2
    - agent-vps-docker-cleanup.timer.j2
    - agent-vps-healthcheck.service.j2
    - agent-vps-healthcheck.timer.j2
  register: vps_ops_systemd_units

- name: Reload systemd when VPS operator units change
  systemd:
    daemon_reload: true
  when: vps_ops_systemd_units.changed

- name: Manage VPS operator timers
  systemd:
    name: "{{ item.name }}"
    enabled: "{{ item.enabled | bool }}"
    state: "{{ 'started' if (item.enabled | bool) else 'stopped' }}"
  loop:
    - name: agent-vps-backup.timer
      enabled: "{{ vps_backup_timer_enabled | bool }}"
    - name: agent-vps-docker-cleanup.timer
      enabled: "{{ vps_docker_cleanup_timer_enabled | bool }}"
    - name: agent-vps-healthcheck.timer
      enabled: "{{ vps_healthcheck_timer_enabled | bool }}"
