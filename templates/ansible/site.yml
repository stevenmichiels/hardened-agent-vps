- hosts: vps
  become: true
  vars:
    admin_user: "admin"
    admin_authorized_keys: []
    admin_user_passwordless_sudo: true
    agent_user: "agent"
    disable_root_login: false

    tailscale_ssh_source_cidr: "100.64.0.0/10"
    bootstrap_public_ssh_cidr: ""
    bootstrap_public_ssh_cidr_cleanup: ""

    allow_http: false
    allow_https: false
    enable_fail2ban_sshd: true

    swap_enabled: true
    swap_file_path: "/swapfile"
    swap_size_mb: 4096
    swap_swappiness: 10

    install_uv: true
    refresh_uv: false
    uv_version: "0.11.14"
    uv_install_dir: "/usr/local/bin"
    install_remote_desktop: false
    remote_desktop_packages:
      - xfce4
      - xfce4-terminal
      - dbus-x11
      - xauth
    install_nomachine: false
    nomachine_version: "9.5.7_2"
    nomachine_deb_url: "https://download.nomachine.com/download/9.5/Linux/nomachine_9.5.7_2_amd64.deb"
    nomachine_deb_md5: "0bfa0b79d4340d864384305eb99e39b8"
    nomachine_port: 4000
    nomachine_key_auth_only: true
    nomachine_allow_tailscale: true
    nomachine_disable_upnp: true
    nomachine_disable_firewall_autoconfig: true
    nomachine_default_desktop_command: "/etc/X11/Xsession startxfce4"
    install_claude_code: false
    refresh_claude_code: false
    install_codex_cli: false
    install_codex_review_helper: true
    codex_review_helper_path: "/usr/local/bin/claude-codex-review"
    claude_skills_dir: "/home/{{ agent_user }}/.claude/skills"
    claude_codex_review_skill_src_dir: "{{ playbook_dir }}/../claude-skills/codex-review"
    vps_zone_dirs_enabled: true
    vps_zone_dirs:
      - path: "/srv/apps"
        owner: root
        group: root
        mode: "0755"
      - path: "/home/{{ agent_user }}/repos"
        owner: "{{ agent_user }}"
        group: "{{ agent_user }}"
        mode: "0755"
      - path: "/home/{{ agent_user }}/agent-workspaces"
        owner: "{{ agent_user }}"
        group: "{{ agent_user }}"
        mode: "0755"
      - path: "/var/backups"
        owner: root
        group: root
        mode: "0755"
    install_vps_ops: true
    install_firecrawl: false

    vps_ops_env_dir: "/etc/agent-vps"
    vps_ops_env_file: "/etc/agent-vps/.env"

    vps_backup_dir: "/var/backups/agent-vps"
    vps_backup_retention_days: 14
    vps_backup_timer_enabled: true
    vps_backup_on_calendar: "daily"
    vps_docker_cleanup_timer_enabled: true
    vps_docker_cleanup_on_calendar: "weekly"
    vps_healthcheck_timer_enabled: true
    vps_healthcheck_on_calendar: "*:0/5"
    vps_monitor_state_dir: "/var/lib/agent-vps-monitor"
    vps_backup_offbox_enabled: false
    vps_backup_offbox_target: ""
    vps_backup_offbox_state_file: "/var/lib/agent-vps-monitor/last-offbox-ok"
    vps_backup_offbox_pending_file: "/var/lib/agent-vps-monitor/offbox-retry-pending"
    vps_backup_offbox_max_age_hours: 36

    # Optional private Firecrawl stack.
    firecrawl_enable_service: false
    firecrawl_env_dir: "/etc/firecrawl"
    firecrawl_env_file: "/etc/firecrawl/firecrawl.env"
    firecrawl_dir: "/opt/firecrawl"
    firecrawl_compose_file: "/opt/firecrawl/docker-compose.yml"
    firecrawl_api_bind_address: "127.0.0.1"
    firecrawl_api_port: 3002
    firecrawl_internal_port: 3002
    firecrawl_image: "ghcr.io/firecrawl/firecrawl:latest"
    firecrawl_playwright_image: "ghcr.io/firecrawl/playwright-service:latest"
    firecrawl_postgres_image: "ghcr.io/firecrawl/nuq-postgres:latest"
    firecrawl_postgres_user: "firecrawl"
    firecrawl_postgres_db: "postgres"
    firecrawl_auto_generate_secrets: true
    firecrawl_compose_pull: false
    firecrawl_num_workers_per_queue: 2
    firecrawl_crawl_concurrent_requests: 2
    firecrawl_max_concurrent_jobs: 1
    firecrawl_browser_pool_size: 1
    firecrawl_playwright_cpus: "1.0"
    firecrawl_playwright_mem_limit: "1536m"
    firecrawl_api_cpus: "2.0"
    firecrawl_api_mem_limit: "3g"
    firecrawl_max_cpu: "0.85"
    firecrawl_max_ram: "0.85"
    firecrawl_block_media: true
    firecrawl_logging_level: "INFO"

    auto_reboot: true
    auto_reboot_time: "03:30"
  pre_tasks:
    - name: Check for local VPS config
      stat:
        path: "{{ playbook_dir }}/vars/local.yml"
      register: vps_local_config
      delegate_to: localhost
      become: false
      tags: always

    - name: Load local VPS config
      include_vars:
        file: "{{ playbook_dir }}/vars/local.yml"
      when: vps_local_config.stat.exists
      tags: always
  roles:
    - base
    - security
    - role: vps_ops
      when: install_vps_ops | bool
      tags: vps_ops
    - role: firecrawl
      when: install_firecrawl | bool
